<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <!-- <title>餅餅英文複習小站</title> -->

  <style>
    :root {
      --ink: #182132;
      --muted: #6e7785;
      --blue: #3858e9;
      --soft: #e9edff;
      --line: #dfe4ef;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(135deg, #eef2ff, #f8fbff 42%, #f8f4ff);
      font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
    }

    main {
      max-width: 820px;
      margin: auto;
      padding: 38px 20px 64px;
    }

    .top,
    .library-head,
    .library-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .eyebrow {
      margin: 0;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0.3rem 0;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
    }

    .sub,
    .small {
      margin: 0;
      color: var(--muted);
    }

    .stat {
      padding: 11px 15px;
      text-align: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .stat b {
      display: block;
      font-size: 1.35rem;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.76rem;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 4px;
      margin: 30px 0 18px;
      background: #e8ecf5;
      border-radius: 14px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .tab {
      padding: 11px 7px;
      color: #566071;
      font-weight: 700;
      background: transparent;
      border: 0;
      border-radius: 10px;
    }

    .tab.active {
      color: var(--blue);
      background: #fff;
    }

    .card {
      padding: clamp(22px, 5vw, 42px);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 12px 34px rgba(27, 48, 90, 0.1);
    }

    .progress {
      height: 8px;
      margin-bottom: 28px;
      overflow: hidden;
      background: #e9edf4;
      border-radius: 8px;
    }

    .progress i {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #5e78ff, #aa6bea);
      transition: 0.25s;
    }

    .mode-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.87rem;
    }

    .word {
      margin: 0 0 7px;
      font-size: clamp(2rem, 7vw, 3.5rem);
    }

    .bobbing {
      animation: bob 0.62s ease-in-out;
    }

    @keyframes bob {
      0%,
      100% {
        transform: translateY(0);
      }

      45% {
        transform: translateY(-13px) scale(1.05);
      }
    }

    .hint {
      margin: 0 0 28px;
      color: var(--muted);
    }

    .answer {
      width: 100%;
      padding: 14px 15px;
      font-size: 1.12rem;
      border: 2px solid var(--line);
      border-radius: 13px;
      outline: none;
    }

    .answer:focus {
      border-color: var(--blue);
    }

    .primary {
      width: 100%;
      padding: 13px 20px;
      margin-top: 13px;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      background: var(--blue);
      border: 0;
      border-radius: 12px;
    }

    .feedback {
      display: none;
      padding: 16px;
      margin-top: 18px;
      background: var(--soft);
      border-radius: 14px;
    }

    .feedback.show,
    .example.show {
      display: block;
    }

    .self-check {
      display: flex;
      gap: 10px;
      margin-top: 13px;
    }

    .good,
    .again {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
    }

    .good {
      color: #177447;
      background: #e7f7ef;
      border: 1px solid #bde7cd;
    }

    .again {
      color: #b6364d;
      background: #fff0f2;
      border: 1px solid #f1bdc8;
    }

    .example {
      display: none;
      padding: 14px;
      margin-top: 15px;
      line-height: 1.65;
      background: #fff;
      border-left: 4px solid var(--blue);
      border-radius: 11px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .choice {
      min-height: 58px;
      padding: 10px;
      font-weight: 750;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .choice.correct {
      background: #e7f7ef;
      border-color: #51b985;
    }

    .choice.wrong {
      background: #fff0f2;
      border-color: #e37a8d;
    }

    .cloze {
      padding: 18px;
      font-size: 1.2rem;
      line-height: 1.8;
      background: #f7f9fd;
      border-radius: 14px;
    }

    .blank {
      color: var(--blue);
      font-weight: 900;
    }

    .library-list {
      display: grid;
      gap: 10px;
      margin-top: 19px;
    }

    .library-row {
      align-items: center;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .badge {
      padding: 4px 9px;
      color: #b6364d;
      font-size: 0.8rem;
      background: #fff0f2;
      border-radius: 99px;
    }

    .empty {
      padding: 42px 10px;
      color: var(--muted);
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 520px) {
      main {
        padding-top: 25px;
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .self-check {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="top">
      <div>
        <p class="eyebrow">麻吉人GOGOGO</p>
        <h1>餅餅英文複習小站</h1>
        <p class="sub">先回想，再自己判斷熟不熟。</p>
      </div>

      <div class="stat">
        <b id="weakCount">0</b>
        <span>待複習單字</span>
      </div>
    </header>

    <nav>
      <button class="tab active" data-view="translate">中文輸入</button>
      <button class="tab" data-view="cloze">選字填空</button>
      <button class="tab" data-view="library">複習單字庫</button>
    </nav>

    <section id="translate" class="card view">
      <div class="progress"><i id="bar"></i></div>

      <p class="mode-label">看英文，輸入中文意思</p>
      <h2 class="word" id="word"></h2>
      <p class="hint">可以寫你想到的中文，不會因同義詞或寫法不同被系統判錯。</p>

      <input id="meaning" class="answer" autocomplete="off" placeholder="輸入中文意思">
      <button id="check" class="primary">查看答案</button>

      <div id="feedback" class="feedback">
        標準答案：<strong id="standard"></strong>

        <p class="small" style="margin-top: 12px">你覺得剛剛的答案算對嗎？</p>

        <div class="self-check">
          <button id="know" class="good">我答對了</button>
          <button id="review" class="again">還不熟</button>
        </div>

        <div id="example" class="example"></div>
        <button id="nextAfterReview" class="primary hidden">下一題</button>
      </div>
    </section>

    <section id="cloze" class="card view hidden">
      <p class="mode-label">選字填空</p>
      <h2 class="word" id="clozeTitle"></h2>

      <p class="cloze">
        請選出正確英文單字：
        <span class="blank">______</span>
      </p>

      <div id="choices" class="choices"></div>
      <p id="clozeNote" class="small" style="margin-top: 14px"></p>
      <button id="nextCloze" class="primary hidden">下一題</button>
    </section>

    <section id="library" class="card view hidden">
      <div class="library-head">
        <div>
          <p class="mode-label">答過「還不熟」的字</p>
          <h2 style="margin: 0">複習單字庫</h2>
        </div>

        <button id="clearWeak" class="tab">清空紀錄</button>
      </div>

      <div id="libraryList" class="library-list"></div>
    </section>
  </main>

  <script>
    const $ = (selector) => document.querySelector(selector);

    let words = [];
    let current;
    let cloze;

    let weak = JSON.parse(localStorage.getItem("weakWords") || "{}");

    const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);

    async function start() {
      try {
        words = await fetch("./vocabulary.json").then((response) => response.json());

        renderWeakCount();
        newTranslate();
      } catch {
        document.querySelector("#translate").innerHTML = `
          <p>找不到 vocabulary.json，請確認它和 index.html 放在同一個資料夾。</p>
        `;
      }
    }

    function pick() {
      const pool = words.flatMap((word) =>
        Array(weak[word.en] ? 4 : 1).fill(word)
      );

      return pool[Math.floor(Math.random() * pool.length)];
    }

    function save() {
      localStorage.setItem("weakWords", JSON.stringify(weak));
      renderWeakCount();
    }

    function renderWeakCount() {
      $("#weakCount").textContent = Object.keys(weak).length;
    }

    function newTranslate() {
      current = pick();

      $("#word").textContent = current.en;
      $("#meaning").value = "";

      $("#feedback").classList.remove("show");
      $("#example").classList.remove("show");
      $("#nextAfterReview").classList.add("hidden");

      $("#know").classList.remove("hidden");
      $("#review").classList.remove("hidden");

      $("#meaning").focus();
      $("#bar").style.width = `${Math.random() * 70 + 20}%`;
    }

    function showAnswer() {
      if (!$("#meaning").value.trim()) return;

      $("#standard").textContent = current.zh;
      $("#feedback").classList.add("show");
    }

    function grade(isCorrect) {
      if (isCorrect) {
        delete weak[current.en];
        save();

        $("#word").classList.add("bobbing");

        setTimeout(() => {
          $("#word").classList.remove("bobbing");
          newTranslate();
        }, 650);

        return;
      }

      weak[current.en] = (weak[current.en] || 0) + 1;
      save();

      $("#example").innerHTML = `
        <b>簡單例句</b><br>
        ${current.example}
      `;

      $("#example").classList.add("show");
      $("#know").classList.add("hidden");
      $("#review").classList.add("hidden");
      $("#nextAfterReview").classList.remove("hidden");
    }

    function newCloze() {
      cloze = pick();

      const options = shuffle([
        cloze,
        ...shuffle(words.filter((word) => word.en !== cloze.en)).slice(0, 3)
      ]);

      $("#clozeTitle").textContent = `「${cloze.zh}」`;
      $("#choices").innerHTML = "";
      $("#clozeNote").textContent = "";
      $("#nextCloze").classList.add("hidden");

      options.forEach((word) => {
        const button = document.createElement("button");

        button.className = "choice";
        button.textContent = word.en;
        button.onclick = () => answerCloze(button, word);

        $("#choices").append(button);
      });
    }

    function answerCloze(button, selectedWord) {
      if (!$("#nextCloze").classList.contains("hidden")) return;

      document.querySelectorAll(".choice").forEach((item) => {
        item.disabled = true;
      });

      const isCorrect = selectedWord.en === cloze.en;

      button.classList.add(isCorrect ? "correct" : "wrong");

      if (!isCorrect) {
        weak[cloze.en] = (weak[cloze.en] || 0) + 1;

        [...document.querySelectorAll(".choice")]
          .find((item) => item.textContent === cloze.en)
          .classList.add("correct");

        $("#clozeNote").innerHTML = `
          正確答案是 <b>${cloze.en}</b>。例句：${cloze.example}
        `;
      } else {
        $("#clozeNote").textContent = `答對了！${cloze.example}`;
      }

      save();
      $("#nextCloze").classList.remove("hidden");
    }

    function renderLibrary() {
      const list = $("#libraryList");
      const items = words.filter((word) => weak[word.en]);

      list.innerHTML = "";

      if (!items.length) {
        list.innerHTML = `
          <div class="empty">目前沒有待複習單字。</div>
        `;

        return;
      }

      items
        .sort((a, b) => weak[b.en] - weak[a.en])
        .forEach((word) => {
          const row = document.createElement("div");

          row.className = "library-row";
          row.innerHTML = `
            <div>
              <b>${word.en}</b>
              <div class="small">${word.zh}</div>
            </div>
            <span class="badge">還不熟 ${weak[word.en]} 次</span>
          `;

          list.append(row);
        });
    }

    document.querySelectorAll(".tab[data-view]").forEach((tab) => {
      tab.onclick = () => {
        document.querySelectorAll(".tab[data-view]").forEach((item) => {
          item.classList.toggle("active", item === tab);
        });

        document.querySelectorAll(".view").forEach((view) => {
          view.classList.toggle("hidden", view.id !== tab.dataset.view);
        });

        if (tab.dataset.view === "library") {
          renderLibrary();
        }

        if (tab.dataset.view === "cloze") {
          newCloze();
        }
      };
    });

    $("#check").onclick = showAnswer;

    $("#meaning").onkeydown = (event) => {
      if (event.key === "Enter") {
        showAnswer();
      }
    };

    $("#know").onclick = () => grade(true);
    $("#review").onclick = () => grade(false);
    $("#nextAfterReview").onclick = newTranslate;
    $("#nextCloze").onclick = newCloze;

    $("#clearWeak").onclick = () => {
      if (confirm("確定清空待複習紀錄？")) {
        weak = {};
        save();
        renderLibrary();
      }
    };

    start();
  </script>
</body>
</html>
