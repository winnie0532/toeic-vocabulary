<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>英文複習小站</title>
  <style>
    :root {
      --ink: #182132;
      --muted: #6e7785;
      --blue: #3858e9;
      --soft: #e9edff;
      --line: #dfe4ef
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #eef2ff, #f8fbff 42%, #f8f4ff);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
      min-height: 100vh
    }

    main {
      max-width: 820px;
      margin: auto;
      padding: 38px 20px 64px
    }

    .top,
    .library-head,
    .library-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px
    }

    .eyebrow {
      margin: 0;
      color: var(--blue);
      font-weight: 800;
      letter-spacing: .08em;
      font-size: .78rem
    }

    h1 {
      margin: .3rem 0;
      font-size: clamp(1.8rem, 5vw, 2.6rem)
    }

    .sub,
    .small {
      color: var(--muted);
      margin: 0
    }

    .stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 11px 15px;
      text-align: center
    }

    .stat b {
      font-size: 1.35rem;
      display: block
    }

    .stat span {
      font-size: .76rem;
      color: var(--muted)
    }

    nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #e8ecf5;
      border-radius: 14px;
      padding: 4px;
      margin: 30px 0 18px
    }

    button {
      font: inherit;
      cursor: pointer
    }

    .tab {
      border: 0;
      border-radius: 10px;
      padding: 11px 7px;
      color: #566071;
      background: transparent;
      font-weight: 700
    }

    .tab.active {
      background: #fff;
      color: var(--blue)
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: clamp(22px, 5vw, 42px);
      box-shadow: 0 12px 34px rgba(27, 48, 90, .10)
    }

    .progress {
      height: 8px;
      background: #e9edf4;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 28px
    }

    .progress i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #5e78ff, #aa6bea);
      transition: .25s
    }

    .mode-label {
      color: var(--muted);
      font-size: .87rem;
      margin: 0 0 8px
    }

    .word {
      font-size: clamp(1.45rem, 4vw, 2.1rem);
      margin: 0 0 7px
    }

    .bobbing {
      animation: bob .62s ease-in-out
    }

    @keyframes bob {
      0%,
      100% {
        transform: translateY(0)
      }

      45% {
        transform: translateY(-13px) scale(1.05)
      }
    }

    .hint {
      color: var(--muted);
      margin: 0 0 28px
    }

    .answer {
      width: 100%;
      font-size: 1.12rem;
      border: 2px solid var(--line);
      border-radius: 13px;
      padding: 14px 15px;
      outline: none
    }

    .answer:focus {
      border-color: var(--blue)
    }

    .primary {
      border: 0;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      padding: 13px 20px;
      border-radius: 12px;
      margin-top: 13px;
      width: 100%;
      font-size: 1rem
    }

    .secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      font-weight: 800;
      padding: 12px 20px;
      border-radius: 12px;
      width: 100%;
      font-size: 1rem
    }

    .feedback {
      display: none;
      background: var(--soft);
      border-radius: 14px;
      padding: 16px;
      margin-top: 18px
    }

    .feedback.show,
    .example.show {
      display: block
    }

    .self-check {
      display: flex;
      gap: 10px;
      margin-top: 13px
    }

    .good,
    .again {
      flex: 1;
      border-radius: 10px;
      padding: 11px;
      border: 1px solid
    }

    .good {
      background: #e7f7ef;
      color: #177447;
      border-color: #bde7cd
    }

    .again {
      background: #fff0f2;
      color: #b6364d;
      border-color: #f1bdc8
    }

    .example {
      display: none;
      margin-top: 15px;
      padding: 14px;
      border-radius: 11px;
      background: #fff;
      border-left: 4px solid var(--blue);
      line-height: 1.65
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px
    }

    .choice {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      min-height: 58px;
      padding: 10px;
      font-weight: 750
    }

    .choice.correct {
      background: #e7f7ef;
      border-color: #51b985
    }

    .choice.wrong {
      background: #fff0f2;
      border-color: #e37a8d
    }

    .cloze {
      font-size: 1.2rem;
      line-height: 1.8;
      background: #f7f9fd;
      border-radius: 14px;
      padding: 18px
    }

    .blank {
      font-weight: 900;
      color: var(--blue)
    }

    .library-list {
      display: grid;
      gap: 10px;
      margin-top: 19px
    }

    .library-row {
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      align-items: center
    }

    .library-tags {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end
    }

    .badge {
      font-size: .8rem;
      color: #b6364d;
      background: #fff0f2;
      border-radius: 99px;
      padding: 4px 9px
    }

    .custom-badge {
      color: #3651bf;
      background: #e9edff
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 42px 10px
    }

    .add-form {
      display: grid;
      gap: 16px
    }

    .field {
      display: grid;
      gap: 7px;
      font-weight: 750
    }

    .field input,
    .field textarea {
      width: 100%;
      font: inherit;
      border: 2px solid var(--line);
      border-radius: 13px;
      padding: 12px 14px;
      outline: none;
      resize: vertical
    }

    .field input:focus,
    .field textarea:focus {
      border-color: var(--blue)
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 750
    }

    .form-actions {
      display: grid;
      gap: 10px
    }

    .hidden {
      display: none !important
    }

    @media(max-width:520px) {
      main {
        padding-top: 25px
      }

      .choices {
        grid-template-columns: 1fr
      }

      .self-check {
        flex-direction: column
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="top">
      <div>
        <p class="eyebrow">持之以恆</p>
        <h1>餅餅的英文複習小站</h1>
        <p class="sub">先回想，再自己判斷熟不熟。</p>
      </div>
      <div class="stat">
        <b id="weakCount">0</b>
        <span>待複習單字</span>
      </div>
    </header>

    <nav>
      <button class="tab active" data-view="translate">中文輸入</button>
      <button class="tab" data-view="cloze">選字填空</button>
      <button class="tab" data-view="grammar">解題技巧</button>
      <button class="tab" data-view="library">單字庫</button>
    </nav>

    <section id="translate" class="card view">
      <div class="progress"><i id="bar"></i></div>
      <p class="mode-label">看英文，輸入中文意思</p>
      <h2 class="word" id="word"></h2>
      <p class="hint">可以寫你想到的中文，不會因同義詞或寫法不同被系統判錯。</p>
      <input id="meaning" class="answer" autocomplete="off" placeholder="輸入中文意思">
      <button id="check" class="primary">查看答案</button>

      <div id="feedback" class="feedback">
        標準答案：<strong id="standard"></strong>
        <p class="small" style="margin-top:12px">你覺得剛剛的答案算對嗎？</p>
        <div class="self-check">
          <button id="know" class="good">我答對了</button>
          <button id="review" class="again">還不熟</button>
        </div>
        <div id="example" class="example"></div>
        <button id="nextAfterReview" class="primary hidden">下一題</button>
      </div>
    </section>

    <section id="cloze" class="card view hidden">
      <p class="mode-label">多益式句子填空</p>
      <h2 class="word" id="clozeTitle"></h2>
      <p class="cloze" id="clozeSentence"></p>
      <div id="choices" class="choices"></div>
      <p id="clozeNote" class="small" style="margin-top:14px"></p>
      <button id="nextCloze" class="primary hidden">下一題</button>
    </section>

    <section id="grammar" class="card view hidden">
      <p class="mode-label">多益解題技巧</p>
      <h2 class="word" id="grammarTitle"></h2>
      <p class="hint" id="grammarRule"></p>
      <p class="cloze" id="grammarQuestion"></p>
      <div id="grammarChoices" class="choices"></div>
      <p id="grammarNote" class="small" style="margin-top:14px"></p>
      <button id="nextGrammar" class="primary hidden">下一題</button>
    </section>

    <section id="library" class="card view hidden">
      <div class="library-head">
        <div>
          <p class="mode-label">反覆複習</p>
          <h2 style="margin:0">單字庫</h2>
        </div>
        <div>
          <button id="addWord" class="tab">＋ 加入單字</button>
          <button id="clearWeak" class="tab">清空紀錄</button>
        </div>
      </div>

      <div id="libraryList" class="library-list"></div>
      <button id="startLibraryReview" class="primary">開始複習錯題</button>
    </section>

    <section id="libraryReview" class="card view hidden">
      <p class="mode-label">錯題複習</p>
      <h2 class="word" id="libraryReviewWord"></h2>
      <button id="libraryReviewSpeak" class="secondary">🔉 聽發音</button>
      <p class="hint">先自己想中文意思，再按查看答案。</p>
      <button id="showLibraryReviewAnswer" class="primary">查看答案</button>

      <div id="libraryReviewAnswer" class="feedback">
        <p>中文：<strong id="libraryReviewMeaning"></strong></p>
        <div id="libraryReviewExample" class="example show"></div>
        <p class="small" style="margin-top:12px">這個單字現在熟了嗎？</p>

        <div class="self-check">
          <button id="libraryReviewKnow" class="good">我會了</button>
          <button id="libraryReviewAgain" class="again">還不熟</button>
        </div>

        <button id="nextLibraryReview" class="primary hidden">下一個單字</button>
      </div>

      <button id="backToLibrary" class="secondary">回到單字庫</button>
    </section>

    <section id="addWordPage" class="card view hidden">
      <p class="mode-label">自訂單字</p>
      <h2 class="word">加入一個單字</h2>

      <form id="addWordForm" class="add-form">
        <label class="field">
          英文
          <input id="addEnglish" autocomplete="off" required>
        </label>

        <label class="field">
          中文
          <input id="addChinese" autocomplete="off" required>
        </label>

        <label class="field">
          例句
          <textarea id="addExample" rows="3" required></textarea>
        </label>

        <label class="check-row">
          <input id="addToLibrary" type="checkbox" checked>
          放入單字庫
        </label>

        <p id="addWordNote" class="small" aria-live="polite"></p>

        <div class="form-actions">
          <button type="submit" class="primary">加入單字</button>
          <button id="cancelAddWord" type="button" class="secondary">回到單字庫</button>
          <button id="downloadAddedWords" type="button" class="secondary">
            下載 vocabulary_add.json
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="./app.js"></script>
</body>

</html>
